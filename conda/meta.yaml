{% set name = "tsdst" %}
{% set version = "2.0.0" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  path: ..

build:
  number: 0
  script: python -m pip install . --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=80
  run:
    - python >=3.12
    - matplotlib >=3.11,<4
    - numba >=0.68,<1
    - numdifftools >=0.11,<1
    - numpy >=2.5,<3
    - pandas >=3.1,<4
    - scikit-learn >=1.9,<2
    - scipy >=1.18,<2
    - seaborn >=0.13.2,<0.14
    - sqlalchemy >=2.1,<3

test:
  imports:
    - tsdst
    - tsdst.eda
    - tsdst.nn

about:
  home: https://tomwerner5.github.io/tsdst/
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: "A low-key data science and statistics toolkit"
  dev_url: https://github.com/tomwerner5/tsdst/

extra:
  recipe-maintainers:
    - tomwerner5

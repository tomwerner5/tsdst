name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    env:
      MPLBACKEND: Agg
      NUMBA_DISABLE_JIT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]' build
      - run: python -m pytest --cov=tsdst --cov-report=term-missing --cov-report=json:coverage.json
      - run: python scripts/check_function_coverage.py coverage.json
      - run: python -m build

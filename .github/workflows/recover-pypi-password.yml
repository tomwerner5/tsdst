name: Recover PyPI password (encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt-password:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the stored password for local recovery
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          password = os.environ.get("PYPI_PASSWORD", "")
          if not password:
              raise SystemExit("PYPI_PASSWORD is missing or empty.")
          folder = Path(os.environ["RUNNER_TEMP"])
          certificate = folder / "pypi-recovery-certificate.pem"
          certificate.write_text("""-----BEGIN CERTIFICATE-----
          MIIFLzCCAxegAwIBAgIULV0+uKttJ6gAJzNlN4k2bSpMnJswDQYJKoZIhvcNAQEL
          BQAwJzElMCMGA1UEAwwcdHNkc3QgUHlQSSBwYXNzd29yZCByZWNvdmVyeTAeFw0y
          NjEwMjMxMjM2MjdaFw0yNjExMjIxMjM2MjdaMCcxJTAjBgNVBAMMHHRzZHN0IFB5
          UEkgcGFzc3dvcmQgcmVjb3ZlcnkwggIiMA0GCSqGSIb3DQEBAQUAA4ICDwAwggIK
          AoICAQDgdjvC/E+MlngTQovFQQr17T+IeZKUQAlVFw54Y+eRoo4sdY4ACkHxL2GK
          tIeniBFz4ZL/5A0E7xWSuZqHpM6eae1Px3z4jEue7DZQ6luQaM23FJEdhfKX3dxQ
          n3IwRrR0iUqpCTYFL1RNuWlIZ0wpCB1Km8AiP5TBQF+Kkf0gDSOA0IxiHBvayHf2
          MqNxVHJf3yaqrgQjGscfUxpS6RJ7J9kFfZAG53VnwucejgXxZMQRNsG2Ndlf+MPk
          Az+jRiUnEaggxr0N0r8BjgGofNQaZL0hMqVqMzdY9mTPlGh08c2Tqg26zPHpwG76
          VS2hGVqo9NsMVv4vj+/zUS7jcJJ5eyGAFn9iTf5i/G2bR2pa5EsKe8xglf3Y5DS0
          oLXjtaUsxl3lFJ4+zK8oTptWCZWN1WCwrwGZQFa9MRfGL+3VtNzw57s9dFo+ziWW
          UjLDld5AMRbeIvXtGsOzgYvCXxaN8SpBZUH+HW/IbXU6wvVOEcLtPdNaZHB3ww1y
          l4uLkbIALAv15vXEClJbXGwNf4najprETq4QylSHtaacsblOLUgNN/rmAqdwaiZL
          TlV6W7akXfc3iMa921Chry5xZs+G4BV108W6bHUbIRQCK5TUjv5mKUQ5NkD3erMm
          s1H82aLZdw2s6IQMrGray5fD0PBeKe5wj24GxMCAwfvexaTJdQIDAQABo1MwUTAd
          BgNVHQ4EFgQURKqUag9uomG2fpzqBHn+xYioDHAwHwYDVR0jBBgwFoAURKqUag9u
          omG2fpzqBHn+xYioDHAwDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOC
          AgEA4EyuThlaMFRbiqCT++sveVk+E2wPmYptnufmFmcRB5uQCN3Vz83Fx+TkGRxS
          J7TwTD+FwXx7uYc+BxLxzlusgUHc66lDG6iOLejI3YAihx/U9+tbFi/nADzv4TE8
          0Hzwpd8yoc+3ZvyCrvsiIIiIRd957vE6j1C4e2W7ZSgYlYtZZbsGy2nwhAByxgp3
          K7ayB+3Ig1LD/CgoZPM2IM+HRjBoSjQAiqZSbd0wH1RJlmLoVh6t3ctJLjCodwCh
          rzSpuXN5H4AM4oxuvQ29DtKZivfl5H2PICgS/FvwWiIDhBu7DHNaDhA8b3PMWWjT
          QJn3N5opVcPrLCn1EeDUFd76F1LE7sU8EvwXrOybue591QNgwvPR7Vg2cUMSNGuK
          tovictOSSOm5VA/bbqhENP5MJ62T/Hie/k9mKkOXcRXxl4aeahKDngnHW9HuEx4S
          c/AGd81yaRfbOrd9XCL0puY9gEww+LPQtHPPOBBNDiPy0Tzg0/j7KnrfHa6Zc3Fs
          tmnh0afd0D4FMIPvccmPZoXVIGD7iTgpMyal+D2Ul+Qo+tRHI7QOrF56zgu1cRvJ
          439g8y2gjnXm5ZoNp5ipycPqToXHfWZmHTkSIR/Lb9vAxEyAocq5yZvGqnN/n9pb
          EKg9QAxIvwmvPUYM5xtmr60Z67U3dfonVhk17aBzNLqEPZ8=
          -----END CERTIFICATE-----
          """)
          result = subprocess.run(
              ["openssl", "cms", "-encrypt", "-binary", "-aes-256-gcm",
               "-outform", "DER", "-recip", str(certificate),
               "-keyopt", "rsa_padding_mode:oaep",
               "-keyopt", "rsa_oaep_md:sha256",
               "-keyopt", "rsa_mgf1_md:sha256"],
              input=password.encode("utf-8"), capture_output=True,
          )
          if result.returncode:
              raise SystemExit("Encryption failed; no artifact was created.")
          (folder / "pypi-password.cms").write_bytes(result.stdout)
          print("Created the encrypted recovery file. No password value was printed.")
          PY
      - name: Save only the encrypted recovery file
        uses: actions/upload-artifact@v7
        with:
          name: pypi-password-encrypted
          path: ${{ runner.temp }}/pypi-password.cms
          if-no-files-found: error
          retention-days: 1

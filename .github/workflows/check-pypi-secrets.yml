name: Check PyPI secret format

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing secrets without publishing
        env:
          STORED_USERNAME: ${{ secrets.PYPI_USERNAME }}
          STORED_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os

          username = os.environ.get("STORED_USERNAME", "")
          password = os.environ.get("STORED_PASSWORD", "")
          print("Old publisher's username secret matches __token__:", username == "__token__")
          print("The updated publisher sets __token__ directly and ignores that username secret.")
          if not password:
              raise SystemExit("PYPI_PASSWORD is missing or empty.")
          if password != password.strip():
              raise SystemExit("PYPI_PASSWORD has surrounding whitespace. Replace it with the exact token.")
          if not password.startswith("pypi-"):
              raise SystemExit("PYPI_PASSWORD does not have API-token format. Account passwords cannot be used.")
          print("PYPI_PASSWORD has API-token format. No secret values were printed.")
          print("PyPI authentication was not attempted. Token validity and project scope remain unchecked.")
          PY

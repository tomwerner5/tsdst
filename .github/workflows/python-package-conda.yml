name: Publish to Conda

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - name: Set up current conda tools
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: '3.12'
          activate-environment: tsdst-build
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
      - name: Install build and upload tools
        run: conda install --yes --override-channels --channel conda-forge conda-build anaconda-client
      - name: Build and check package
        run: >-
          conda build conda --python 3.12 --package-format 2
          --override-channels --channel conda-forge
          --no-anaconda-upload --output-folder conda-dist
      - name: Upload package
        env:
          ANACONDA_USERNAME: ${{ secrets.ANACONDA_USERNAME }}
          ANACONDA_PASSWORD: ${{ secrets.ANACONDA_PASSWORD }}
          ANACONDA_CLIENT_LEGACY_INTERACTIVE_LOGIN: '1'
        run: |
          # Use non-browser login with the existing username/password secrets.
          anaconda org login --username "$ANACONDA_USERNAME" --password "$ANACONDA_PASSWORD"
          anaconda org upload --user "$ANACONDA_USERNAME" conda-dist/noarch/*.conda

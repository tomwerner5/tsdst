[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tsdst"
dynamic = ["version"]
description = "A low-key data science and statistics toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Tom W", email = "tomwerner5@gmail.com"}]
keywords = ["data science", "statistics", "neural network", "bayesian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.11,<4",
    "numba>=0.68,<1",
    "numdifftools>=0.11,<1",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
    "seaborn>=0.13.2,<0.14",
    "sqlalchemy>=2.1,<3",
]

[project.optional-dependencies]
io = ["pyarrow>=26"]
test = ["pytest>=9", "pytest-cov>=7.1", "pyarrow>=26"]
docs = [
    "sphinx>=8,<10",
    "numpydoc>=1.9,<2",
    "sphinx-bootstrap-theme>=0.8.1,<1",
    "sphinx-copybutton>=0.5.2,<1",
]

[project.urls]
Documentation = "https://tomwerner5.github.io/tsdst/"
Source = "https://github.com/tomwerner5/tsdst"

[tool.setuptools.packages.find]
include = ["tsdst", "tsdst.*"]

[tool.setuptools.dynamic]
version = {attr = "tsdst.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tsdst"]

[tool.coverage.report]
fail_under = 85
show_missing = true
